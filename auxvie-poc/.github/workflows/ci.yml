name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci || npm install
      - run: node -v && npm -v
      - name: Smoke start (no network)
        run: node -e "require('http').createServer((_,res)=>res.end('ok')).listen(0).on('listening',()=>process.exit(0))"
